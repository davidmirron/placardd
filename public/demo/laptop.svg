<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="0" y="640" width="1200" height="160" fill="#c7b8a3"/>
  <ellipse cx="600" cy="660" rx="420" ry="20" fill="#000" opacity="0.15"/>
  <!-- base -->
  <path d="M250 640 L 950 640 L 990 660 L 210 660 Z" fill="#64748b"/>
  <!-- lid (back facing viewer) -->
  <rect x="300" y="120" width="600" height="520" rx="24" fill="url(#lid)"/>
  <rect x="318" y="138" width="564" height="484" rx="16" fill="#cbd5e1" opacity="0.5"/>
